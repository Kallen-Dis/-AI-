services:
  - type: web
    name: travel-ai-demo
    runtime: python
    plan: free
    buildCommand: pip install -r MCP_map/requirements.txt
    startCommand: gunicorn --chdir MCP_map -b 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: BAIDU_MAP_AK
        sync: false
      - key: BAIDU_MAP_BROWSER_AK
        sync: false
